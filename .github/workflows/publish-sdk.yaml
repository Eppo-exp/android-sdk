name: Publish SDK release to Maven Central

on:
  release:
    types: [published]

concurrency:
  group: maven-central-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  CI: true

jobs:
  plan:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      test-data-ref: ${{ steps.fixtures.outputs.ref }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/release/release.py plan --tag "$RELEASE_TAG"
      - id: fixtures
        run: echo "ref=$(cat scripts/release/test-data-ref)" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    uses: ./.github/workflows/test.yaml
    with:
      sdk_branch: ${{ github.sha }}
      test_data_branch: ${{ needs.plan.outputs.test-data-ref }}
  publish:
    needs: test
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release plan
        run: python3 scripts/release/release.py plan --tag "$RELEASE_TAG"

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/release/tests -v

      - name: Download pinned test data
        run: make test-data testDataRef="$(cat scripts/release/test-data-ref)"

      - name: Test SDK
        run: ./gradlew check

      - name: Publish required packages and verify Central
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/release.py publish --tag "$RELEASE_TAG"

      - name: Preserve deployment diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/jreleaser/output.properties
          if-no-files-found: ignore
